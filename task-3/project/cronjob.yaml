apiVersion: batch/v1
kind: CronJob
metadata:
  name: data-exporter
  namespace: default
spec:
  schedule: "0 20 * * *"
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: exporter
              image: data-exporter:latest
              imagePullPolicy: IfNotPresent
              env:
                - name: DB_HOST
                  value: "postgres-service"
                - name: DB_PORT
                  value: "5432"
                - name: DB_NAME
                  value: "logistics"
                - name: DB_USER
                  value: "reader"
                - name: DB_PASSWORD
                  value: "password123"
                - name: TABLE_NAME
                  value: "shipments"
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"